; A sim-mesh station: meshtasticd with its SX1262 and pins on sim-mesh's
; simulated chip (sim-mesh/radio/portduino) instead of spidev and libgpiod.
; sim-mesh's radio/portduino library is taken from sim-mesh's clone beside
; this repository.
[env:sim-mesh]
extends = native_base
build_flags = ${portduino_base.build_flags_common}
  -I variants/native/portduino -li2c -lstdc++fs
  -DHAS_SCREEN=0 -DMESHTASTIC_EXCLUDE_SCREEN=1 -DSIM_MESH=1
  -Wl,--wrap=bind -Wl,--wrap=listen -Wl,--wrap=accept -Wl,--wrap=close
build_src_filter = ${native_base.build_src_filter} -<graphics/Panel_sdl.cpp> -<graphics/TFTDisplay.cpp> -<mesh/raspihttp/>
lib_deps = ${native_base.lib_deps}
  simradio-portduino=symlink://../sim-mesh/radio/portduino
lib_ignore = ${portduino_base.lib_ignore}
  LovyanGFX
extra_scripts = ${env.extra_scripts}
  pre:../sim-mesh/radio/portduino/casefold.py
  post:../sim-mesh/radio/portduino/cross.py
